  <!-- Selection formula -->
  <rect x="25" y="342" width="950" height="68" rx="4" fill="#060e1a" stroke="#1d4ed8" stroke-width="1"/>
  <text x="500" y="362" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Cálculo de I_Δn (sensibilidad del diferencial tipo B)</text>
  <line x1="40" y1="368" x2="960" y2="368" stroke="#1e3560" stroke-width="0.5"/>
  <text x="150" y="390" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">I_Δn ≥ 3 × I_fuga_total</text>
  <line x1="300" y1="380" x2="300" y2="400" stroke="#1e3560" stroke-width="1"/>
  <text x="500" y="385" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Ejemplo: I_fuga_variador (80 mA) + I_fuga_cable (80 mA) = 160 mA total</text>
  <text x="500" y="400" font-family="Arial,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">→  I_Δn ≥ 3 × 160 mA = 480 mA  →  seleccionar 500 mA normalizado</text>
  <line x1="700" y1="380" x2="700" y2="400" stroke="#1e3560" stroke-width="1"/>
  <text x="830" y="390" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Escalones IEC: 30 / 100 / 300 /</text>
  <text x="830" y="404" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">500 mA / 1 A / 3 A</text>

  <!-- Warning box -->
  <rect x="25" y="422" width="950" height="78" rx="4" fill="#1a0505" stroke="#dc2626" stroke-width="1"/>
  <text x="55" y="444" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ef4444">⚠ ERROR FRECUENTE EN OBRA</text>
  <line x1="40" y1="450" x2="960" y2="450" stroke="#7f1d1d" stroke-width="0.5"/>
  <text x="500" y="468" font-family="Arial,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Sustituir motor por uno con variador sin cambiar el diferencial tipo A existente.</text>
  <text x="500" y="484" font-family="Arial,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">El tipo A puede disparar falsamente (I_fuga &gt; 0,5×I_Δn) o NO disparar ante falta real con CC alisada.</text>
  <text x="500" y="498" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Solución: sustituir siempre por tipo B (IEC 62423) correctamente dimensionado.</text>
</svg>
