  <!-- Row F -->
  <rect x="25" y="226" width="950" height="48" rx="0" fill="#0c1f3a"/>
  <text x="75" y="246" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">F</text>
