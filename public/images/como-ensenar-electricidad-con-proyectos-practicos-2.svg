<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bgabp2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2e"/>
      <stop offset="50%" style="stop-color:#0c2a4a"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bgabp2)"/>
  <rect width="900" height="480" fill="none" stroke="#1e3560" stroke-width="1" rx="4"/>
  <rect x="0" y="0" width="8" height="480" fill="#2563eb" opacity="0.7" rx="2"/>

  <text x="454" y="34" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Verificación instrumental en taller — IEC 60364-6</text>
  <text x="454" y="52" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">UNE-HD 60364-6 · ITC-BT-19 · INDUCTECH TRAINING</text>
  <line x1="25" y1="62" x2="875" y2="62" stroke="#1e3560" stroke-width="1"/>

  <!-- 3 verification items -->
  <!-- Aislamiento -->
  <rect x="25" y="72" width="268" height="290" rx="8" fill="#0c1f3a" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="25" y="72" width="268" height="36" rx="8" fill="#1e3a8a"/>
  <rect x="25" y="94" width="268" height="14" fill="#1e3a8a"/>
  <text x="159" y="94" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">ENSAYO 1</text>
  <text x="159" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Resistencia de</text>
  <text x="159" y="146" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">aislamiento</text>
  <text x="159" y="174" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#60a5fa" text-anchor="middle">≥ 0,5 MΩ</text>
  <text x="159" y="196" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">entre conductores activos y PE</text>
  <line x1="35" y1="205" x2="283" y2="205" stroke="#1e3560" stroke-width="0.8"/>
  <text x="159" y="224" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">Procedimiento:</text>
  <text x="45" y="243" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">1. Circuitos desconectados</text>
  <text x="45" y="261" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">2. Megóhmetro 500 V DC</text>
  <text x="45" y="279" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">3. Entre L-N-PE agrupados</text>
  <text x="45" y="297" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">4. Esperar estabilización 1 min</text>
  <text x="159" y="340" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">tabla 6A · IEC 60364-6</text>
  <text x="159" y="355" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">Instrum: IEC 61557-2</text>

  <!-- Continuidad PE -->
  <rect x="316" y="72" width="268" height="290" rx="8" fill="#0c1f3a" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="316" y="72" width="268" height="36" rx="8" fill="#451a03"/>
  <rect x="316" y="94" width="268" height="14" fill="#451a03"/>
  <text x="450" y="94" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">ENSAYO 2</text>
  <text x="450" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Continuidad del</text>
  <text x="450" y="146" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">conductor PE</text>
  <text x="450" y="174" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#fbbf24" text-anchor="middle">≤ 1 Ω</text>
  <text x="450" y="196" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">en el punto de uso más alejado</text>
  <line x1="326" y1="205" x2="574" y2="205" stroke="#1e3560" stroke-width="0.8"/>
  <text x="450" y="224" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">Procedimiento:</text>
  <text x="336" y="243" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">1. Resistencia entre barra PE y</text>
  <text x="336" y="261" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">   terminal PE del punto más lejano</text>
  <text x="336" y="279" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">2. Corriente de prueba 200 mA</text>
  <text x="336" y="297" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">3. Verificar identificación bicolor</text>
  <text x="450" y="340" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">ITC-BT-19 apt. 2.2.4</text>
  <text x="450" y="355" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">Instrum: IEC 61557-4</text>

  <!-- Bucle de fallo -->
  <rect x="607" y="72" width="268" height="290" rx="8" fill="#0c1f3a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="607" y="72" width="268" height="36" rx="8" fill="#7f1d1d"/>
  <rect x="607" y="94" width="268" height="14" fill="#7f1d1d"/>
  <text x="741" y="94" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">ENSAYO 3</text>
  <text x="741" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Impedancia de bucle</text>
  <text x="741" y="146" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">de fallo</text>
  <text x="741" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f87171" text-anchor="middle">Zs ≤ Uo / Ia</text>
  <text x="741" y="196" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Ia = corriente disparo magnetotérmico</text>
  <line x1="617" y1="205" x2="865" y2="205" stroke="#1e3560" stroke-width="0.8"/>
  <text x="741" y="224" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">Procedimiento:</text>
  <text x="627" y="243" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">1. Medir Zs en punto más lejano</text>
  <text x="627" y="261" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">2. Calcular Ia = 5×In (curva C)</text>
  <text x="627" y="279" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">3. Verificar Zs ≤ 230 V / Ia</text>
  <text x="627" y="297" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">4. Probar diferencial 1×IΔn/5×IΔn</text>
  <text x="741" y="340" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">IEC 60364-4-41 / IEC 60364-6</text>
  <text x="741" y="355" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">Instrum: IEC 61557-3</text>

  <!-- Result box -->
  <rect x="25" y="378" width="850" height="72" rx="6" fill="#0a1628" stroke="#2563eb" stroke-width="1.5"/>
  <text x="454" y="402" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f1f5f9" text-anchor="middle">El alumno que mide es el alumno que sabe verificar en obra</text>
  <text x="454" y="424" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Emitir Acta de Verificación con instrumento, valor medido, valor límite y firma</text>
  <text x="454" y="442" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Referencia: UNE-HD 60364-6:2017 — Verificación de instalaciones eléctricas</text>

  <text x="450" y="468" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">INDUC TECH · ABP Electrotécnica · IEC 60364-6 · Verificación puesta en servicio</text>
</svg>
