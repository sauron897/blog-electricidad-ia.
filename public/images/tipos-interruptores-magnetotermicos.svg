<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2e"/>
      <stop offset="50%" style="stop-color:#0c2a4a"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="480" fill="url(#bg)"/>
  <rect width="900" height="480" fill="none" stroke="#1e3560" stroke-width="1" rx="4"/>

  <!-- Título -->
  <text x="450" y="36" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Interruptores Magnetotérmicos — Curvas de Disparo B, C y D</text>
  <text x="450" y="55" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Protección térmica + magnética · IEC 60898-1 · ITC-BT-22</text>
  <line x1="60" y1="65" x2="840" y2="65" stroke="#1e3560" stroke-width="1"/>

  <!-- Ejes del gráfico de curvas -->
  <line x1="100" y1="380" x2="800" y2="380" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="100" y1="100" x2="100" y2="380" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Etiquetas eje X -->
  <text x="450" y="415" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Múltiplo de In (corriente / In)</text>
  <text x="110" y="395" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">1×</text>
  <text x="220" y="395" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">3×</text>
  <text x="340" y="395" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">5×</text>
  <text x="500" y="395" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">10×</text>
  <text x="700" y="395" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">20×</text>

  <!-- Etiqueta eje Y -->
  <text x="55" y="245" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 55 245)">Tiempo de disparo</text>
  <text x="88" y="115" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="end">min</text>
  <text x="88" y="200" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="end">seg</text>
  <text x="88" y="320" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="end">ms</text>

  <!-- Líneas guía horizontales -->
  <line x1="100" y1="115" x2="800" y2="115" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="200" x2="800" y2="200" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="100" y1="320" x2="800" y2="320" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Líneas guía verticales (múltiplos) -->
  <line x1="220" y1="100" x2="220" y2="380" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="340" y1="100" x2="340" y2="380" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="500" y1="100" x2="500" y2="380" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="100" x2="700" y2="380" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- CURVA B (rojo) — disparo 3x-5x -->
  <polyline points="110,110 180,160 220,300 340,360 340,380" fill="none" stroke="#ef4444" stroke-width="2.5" filter="url(#glow)"/>
  <!-- zona instantánea B -->
  <line x1="220" y1="360" x2="340" y2="360" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="220" y="340" width="120" height="40" fill="#ef4444" fill-opacity="0.1" rx="2"/>
  <text x="280" y="335" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">CURVA B</text>
  <text x="280" y="323" font-family="Arial,sans-serif" font-size="9" fill="#ef4444" text-anchor="middle">3×—5× In</text>

  <!-- CURVA C (azul claro) — disparo 5x-10x -->
  <polyline points="110,112 180,162 340,290 500,345 500,380" fill="none" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="340" y1="355" x2="500" y2="355" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="340" y="335" width="160" height="40" fill="#3b82f6" fill-opacity="0.1" rx="2"/>
  <text x="420" y="330" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">CURVA C</text>
  <text x="420" y="318" font-family="Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">5×—10× In</text>

  <!-- CURVA D (verde) — disparo 10x-20x -->
  <polyline points="110,114 180,164 500,270 700,335 700,380" fill="none" stroke="#22c55e" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="500" y1="350" x2="700" y2="350" stroke="#22c55e" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="500" y="330" width="200" height="40" fill="#22c55e" fill-opacity="0.1" rx="2"/>
  <text x="600" y="325" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="middle">CURVA D</text>
  <text x="600" y="313" font-family="Arial,sans-serif" font-size="9" fill="#22c55e" text-anchor="middle">10×—20× In</text>

  <!-- Zona térmica (izquierda) -->
  <rect x="101" y="101" width="110" height="278" fill="#2563eb" fill-opacity="0.04" rx="2"/>
  <text x="156" y="250" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle" transform="rotate(-90 156 250)">Protección térmica (sobrecarga)</text>

  <!-- Zona magnética (derecha) - B -->
  <rect x="218" y="338" width="124" height="44" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <!-- Zona magnética - C -->
  <rect x="338" y="333" width="164" height="44" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <!-- Zona magnética - D -->
  <rect x="498" y="328" width="204" height="44" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" rx="2"/>

  <!-- Leyenda aplicación -->
  <rect x="580" y="85" width="290" height="105" fill="#0c1f3a" stroke="#1e3560" stroke-width="1" rx="6"/>
  <text x="725" y="103" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">APLICACIÓN TÍPICA</text>
  <circle cx="600" cy="120" r="5" fill="#ef4444"/>
  <text x="612" y="124" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">B — Alumbrado, líneas largas, resistivo</text>
  <circle cx="600" cy="142" r="5" fill="#3b82f6"/>
  <text x="612" y="146" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">C — Uso general, tomas, mixto</text>
  <circle cx="600" cy="164" r="5" fill="#22c55e"/>
  <text x="612" y="168" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">D — Motores, transformadores</text>

  <!-- Acento izquierdo -->
  <rect x="0" y="0" width="8" height="480" fill="#2563eb" opacity="0.7" rx="2"/>

  <!-- Footer -->
  <line x1="60" y1="435" x2="840" y2="435" stroke="#1e3560" stroke-width="1"/>
  <text x="450" y="455" font-family="Arial,sans-serif" font-size="10" fill="#4a6a8a" text-anchor="middle">INDUC TECH · Ingeniería Eléctrica · IEC 60898-1 · ITC-BT-22</text>
</svg>
