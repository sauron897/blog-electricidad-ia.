  <text x="742" y="158" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fca5a5" text-anchor="middle">S ≥ Icc · √t / k</text>
  <text x="742" y="183" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">t = tiempo actuación protección (s)</text>
  <line x1="629" y1="192" x2="855" y2="192" stroke="#1e3560" stroke-width="0.8"/>
