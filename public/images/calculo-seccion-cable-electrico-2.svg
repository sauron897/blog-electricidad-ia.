  <text x="175" y="282" font-family="Arial,sans-serif" font-size="11" fill="#10b981" text-anchor="middle">31 A</text>
  <text x="260" y="282" font-family="Arial,sans-serif" font-size="11" fill="#10b981" text-anchor="end">36 A</text>
