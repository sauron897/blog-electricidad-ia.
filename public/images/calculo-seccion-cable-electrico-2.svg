  <text x="158" y="158" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#60a5fa" text-anchor="middle">Ib ≤ In ≤ Iz</text>
  <text x="158" y="183" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Iz_corr = Iz_base × kt × ka</text>
  <line x1="45" y1="192" x2="271" y2="192" stroke="#1e3560" stroke-width="0.8"/>
