  <text x="600" y="225" font-family="Arial,sans-serif" font-size="24" fill="#7c3aed" text-anchor="middle">→</text>
  <text x="600" y="243" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">S₂</text>

  <!-- Box 3: Cortocircuito -->
  <rect x="614" y="75" width="256" height="290" rx="8" fill="#0c1f3a" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="614" y="75" width="256" height="36" rx="8" fill="#7f1d1d"/>
  <rect x="614" y="97" width="256" height="14" fill="#7f1d1d"/>
