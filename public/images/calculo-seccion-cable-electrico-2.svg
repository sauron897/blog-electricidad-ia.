  <text x="635" y="232" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">Cu + PVC (70°C) ............</text>
  <text x="852" y="232" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="end">115</text>
  <text x="635" y="252" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">Cu + XLPE (90°C) ...........</text>
  <text x="852" y="252" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="end">143</text>
  <text x="635" y="272" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">Al + PVC (70°C) .............</text>
  <text x="852" y="272" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="end">76</text>
  <text x="635" y="292" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">Al + XLPE (90°C) ............</text>
  <text x="852" y="292" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="end">94</text>
  <text x="742" y="330" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Icc_min: en el punto más alejado</text>
  <text x="742" y="348" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">IEC 60364-4-43 · ITC-BT-22</text>

  <!-- Result box -->
  <rect x="30" y="385" width="840" height="70" rx="8" fill="#0a1628" stroke="#2563eb" stroke-width="2"/>
