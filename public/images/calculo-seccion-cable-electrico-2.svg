  <text x="308" y="225" font-family="Arial,sans-serif" font-size="24" fill="#2563eb" text-anchor="middle">→</text>
  <text x="308" y="243" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">S₁</text>

  <!-- Box 2: Caída de tensión -->
  <rect x="322" y="75" width="256" height="290" rx="8" fill="#0c1f3a" stroke="#7c3aed" stroke-width="1.5"/>
