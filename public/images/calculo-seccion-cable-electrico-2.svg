  <text x="158" y="348" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">tabla B.52.3 · Cu · 40°C</text>
  <text x="158" y="358" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">UNE-HD 60364-5-52:2022</text>

