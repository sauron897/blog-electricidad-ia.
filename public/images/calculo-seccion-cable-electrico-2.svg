  <text x="454" y="52" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Art. 2 ITC-BT-19 · UNE-HD 60364-5-52:2022 · INDUCTECH TRAINING</text>
  <line x1="60" y1="62" x2="840" y2="62" stroke="#1e3560" stroke-width="1"/>

