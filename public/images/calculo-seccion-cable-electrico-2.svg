  <text x="450" y="97" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">CRITERIO 2</text>
  <text x="450" y="128" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Caída de tensión</text>
