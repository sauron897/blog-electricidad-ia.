  <text x="450" y="440" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">→ Redondear al calibre normalizado superior: 1,5 / 2,5 / 4 / 6 / 10 / 16 / 25 / 35 / 50 mm²</text>

