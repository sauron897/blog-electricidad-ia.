  <text x="450" y="151" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ddd6fe" text-anchor="middle">ΔU = 2·ρ·L·Ib / S</text>
  <text x="450" y="162" font-family="Arial,sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">(monofásico; ×√3 en trifásico)</text>
  <line x1="337" y1="192" x2="563" y2="192" stroke="#1e3560" stroke-width="0.8"/>
  <text x="450" y="210" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">Límites ITC-BT-19</text>
  <rect x="337" y="218" width="113" height="52" rx="5" fill="#1e1b4b"/>
  <text x="393" y="236" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Alumbrado</text>
  <text x="393" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#a78bfa" text-anchor="middle">≤ 3%</text>
  <rect x="463" y="218" width="113" height="52" rx="5" fill="#1e1b4b"/>
  <text x="519" y="236" font-family="Arial,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Fuerza / usos</text>
  <text x="519" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#a78bfa" text-anchor="middle">≤ 5%</text>
  <text x="450" y="292" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ρCu = 0,0179 Ω·mm²/m</text>
  <text x="450" y="308" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ρAl = 0,0296 Ω·mm²/m</text>
  <text x="450" y="330" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Despeja S: S = 2·ρ·L·Ib / ΔUmax</text>
  <text x="450" y="348" font-family="Arial,sans-serif" font-size="9" fill="#4a6a8a" text-anchor="middle">art. 3 · ITC-BT-19 · REBT</text>

