<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgerr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="40%" style="stop-color:#0c2a4a"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgerr)"/>
  <rect width="1200" height="630" fill="none" stroke="#1e3560" stroke-width="1"/>
  <rect x="0" y="0" width="10" height="630" fill="#dc2626" opacity="0.8"/>
  <rect x="0" y="0" width="1200" height="6" fill="#dc2626" opacity="0.5"/>

  <!-- Decorative grid -->
  <line x1="640" y1="0" x2="640" y2="630" stroke="#1e3560" stroke-width="0.5" stroke-dasharray="6,10"/>

  <!-- Left: Title -->
  <text x="60" y="110" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" letter-spacing="3">INDUCTECH TRAINING · DIAGNÓSTICO TÉCNICO</text>
  <text x="60" y="180" font-family="Arial,sans-serif" font-size="50" font-weight="bold" fill="#f1f5f9">7 Errores</text>
  <text x="60" y="240" font-family="Arial,sans-serif" font-size="50" font-weight="bold" fill="#f1f5f9">Críticos en</text>
  <text x="60" y="300" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ef4444">Instalaciones</text>
  <text x="60" y="355" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ef4444">Eléctricas</text>
  <text x="60" y="405" font-family="Arial,sans-serif" font-size="18" fill="#94a3b8">Diagnóstico y criterios de corrección para técnicos</text>
  <text x="60" y="430" font-family="Arial,sans-serif" font-size="15" fill="#64748b">IEC 60364 · REBT · UNE-EN 60898 · IEC 61008</text>

  <line x1="60" y1="455" x2="580" y2="455" stroke="#dc2626" stroke-width="2"/>

  <rect x="60" y="472" width="150" height="26" rx="13" fill="#450a0a"/>
  <text x="135" y="489" font-family="Arial,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Riesgo eléctrico</text>
  <rect x="222" y="472" width="145" height="26" rx="13" fill="#450a0a"/>
  <text x="294" y="489" font-family="Arial,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">REBT ITC-BT</text>
  <rect x="379" y="472" width="155" height="26" rx="13" fill="#450a0a"/>
  <text x="456" y="489" font-family="Arial,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">IEC 60364-5-52</text>

  <!-- Right: 7 errors list -->
  <rect x="660" y="60" width="510" height="540" rx="10" fill="#081426" stroke="#1e3560" stroke-width="1"/>
  <text x="915" y="95" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">ERRORES MÁS FRECUENTES</text>
  <line x1="670" y1="105" x2="1160" y2="105" stroke="#1e3560" stroke-width="1"/>

  <!-- Error list items -->
  <circle cx="695" cy="130" r="10" fill="#7f1d1d"/>
  <text x="695" y="135" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">1</text>
  <text x="716" y="128" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Conductor infradimensionado</text>
  <text x="716" y="144" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Ib &gt; Iz · cable a 110% capacidad · IEC 60364-5-52 tabla B.52.3</text>

  <line x1="670" y1="158" x2="1160" y2="158" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="178" r="10" fill="#7f1d1d"/>
  <text x="695" y="183" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">2</text>
  <text x="716" y="176" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Tierra con resistencia &gt; 37 Ω</text>
  <text x="716" y="192" font-family="Arial,sans-serif" font-size="10" fill="#64748b">RT &gt; 50V/IΔn · diferencial 30 mA exige RT &lt; 1.666 Ω · ITC-BT-18</text>

  <line x1="670" y1="206" x2="1160" y2="206" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="226" r="10" fill="#7f1d1d"/>
  <text x="695" y="231" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">3</text>
  <text x="716" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Diferencial tipo AC con cargas electrónicas</text>
  <text x="716" y="240" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Corriente fuga DC → diferencial AC no dispara · usar tipo A (IEC 61008-1)</text>

  <line x1="670" y1="254" x2="1160" y2="254" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="274" r="10" fill="#7f1d1d"/>
  <text x="695" y="279" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">4</text>
  <text x="716" y="272" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Magnetotérmico sobredimensionado</text>
  <text x="716" y="288" font-family="Arial,sans-serif" font-size="10" fill="#64748b">In &gt; Iz → el cable queda sin protección térmica real · ITC-BT-22</text>

  <line x1="670" y1="302" x2="1160" y2="302" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="322" r="10" fill="#7f1d1d"/>
  <text x="695" y="327" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">5</text>
  <text x="716" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Poder de corte insuficiente</text>
  <text x="716" y="336" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Icu &lt; Icc del punto · fusión del dispositivo en cc · IEC 60898-1</text>

  <line x1="670" y1="350" x2="1160" y2="350" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="370" r="10" fill="#7f1d1d"/>
  <text x="695" y="375" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">6</text>
  <text x="716" y="368" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Ausencia de verificación de aislamiento</text>
  <text x="716" y="384" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Mínimo 0,5 MΩ entre activos y tierra · IEC 60364-6 tabla 6A</text>

  <line x1="670" y1="398" x2="1160" y2="398" stroke="#1e3560" stroke-width="0.5"/>

  <circle cx="695" cy="418" r="10" fill="#7f1d1d"/>
  <text x="695" y="423" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f87171" text-anchor="middle">7</text>
  <text x="716" y="416" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9">Circuito sin conductor de protección</text>
  <text x="716" y="432" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Continuidad PE ≤ 1 Ω · ausencia = riesgo contacto indirecto · ITC-BT-19</text>

  <line x1="670" y1="446" x2="1160" y2="446" stroke="#1e3560" stroke-width="1"/>

  <!-- Summary box -->
  <rect x="670" y="456" width="490" height="128" rx="6" fill="#0c1f3a"/>
  <text x="915" y="477" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">REGLA DE DIAGNÓSTICO TÉCNICO</text>
  <text x="680" y="496" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">La instalación no falla en el disparo — falla en silencio.</text>
  <text x="680" y="514" font-family="Arial,sans-serif" font-size="11" fill="#e2e8f0">Mide antes de concluir: aislamiento, bucle de fallo, continuidad PE.</text>
  <text x="680" y="532" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Instrumento mínimo: megóhmetro 500 V + comprobador de bucle con función RCD.</text>
  <text x="680" y="550" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Norma de referencia: IEC 60364-6 (UNE-HD 60364-6) — Verificación.</text>
  <text x="680" y="572" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Tiempo de disparo diferencial verificado con 5·IΔn (test al 100% y 500%).</text>

  <!-- Footer -->
  <text x="600" y="620" font-family="Arial,sans-serif" font-size="10" fill="#4a6a8a" text-anchor="middle">INDUC TECH · Diagnóstico instalaciones · IEC 60364 · ITC-BT · UNE-EN 60898</text>
</svg>
