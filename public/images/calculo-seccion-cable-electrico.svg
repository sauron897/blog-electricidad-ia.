<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
    <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#0d1b2e"/>
                  <stop offset="50%" style="stop-color:#0c2a4a"/>
                  <stop offset="100%" style="stop-color:#0d1b2e"/>
          </linearGradient>
          <linearGradient id="cable" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#b45309"/>
                  <stop offset="40%" style="stop-color:#f59e0b"/>
                  <stop offset="100%" style="stop-color:#92400e"/>
          </linearGradient>
          <linearGradient id="insul" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#1e3a5f"/>
                  <stop offset="100%" style="stop-color:#1e3560"/>
          </linearGradient>
          <filter id="glow">
                  <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                  <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
    </defs>

    <!-- Fondo -->
    <rect width="900" height="480" fill="url(#bg)"/>
    <rect width="900" height="480" fill="none" stroke="#1e3560" stroke-width="1" rx="4"/>

    <!-- Título -->
    <text x="450" y="36" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Selección de Sección de Cable — ITC-BT-19</text>
    <text x="450" y="56" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tres criterios independientes · Se aplica el más restrictivo</text>
    <line x1="60" y1="66" x2="840" y2="66" stroke="#1e3560" stroke-width="1"/>

    <!-- ═══════════ SECCIÓN TRANSVERSAL CABLE ═══════════ -->
    <!-- Círculo exterior (chaqueta) -->
    <circle cx="130" cy="200" r="72" fill="#0f2240" stroke="#2563eb" stroke-width="2"/>
    <!-- Aislamiento PVC -->
    <circle cx="130" cy="200" r="58" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Conductor de cobre -->
    <circle cx="130" cy="200" r="38" fill="url(#cable)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Almas del conductor (7 hilos) -->
    <circle cx="130" cy="200" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="148" cy="186" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="148" cy="214" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="112" cy="186" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="112" cy="214" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="157" cy="200" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>
    <circle cx="103" cy="200" r="10" fill="#92400e" stroke="#f59e0b" stroke-width="0.8"/>

    <!-- Cotas sección -->
    <line x1="60" y1="200" x2="92" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="168" y1="200" x2="200" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="62" y1="195" x2="62" y2="205" stroke="#64748b" stroke-width="1"/>
    <line x1="198" y1="195" x2="198" y2="205" stroke="#64748b" stroke-width="1"/>
    <line x1="62" y1="200" x2="198" y2="200" stroke="#64748b" stroke-width="0.5"/>
    <text x="130" y="218" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Ø conductor</text>

    <!-- Leyenda sección -->
    <rect x="62" y="290" width="12" height="12" fill="url(#cable)" stroke="#f59e0b" stroke-width="1"/>
    <text x="80" y="301" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">Cobre (Cu)</text>
    <rect x="62" y="310" width="12" height="12" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="80" y="321" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">Aislamiento PVC</text>
    <rect x="62" y="330" width="12" height="12" fill="#0f2240" stroke="#2563eb" stroke-width="1"/>
    <text x="80" y="341" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0">Cubierta exterior</text>

    <text x="130" y="380" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#3b82f6" text-anchor="middle">Sección transversal</text>
    <text x="130" y="395" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Cable tripolar XLPE</text>

    <!-- Línea divisoria -->
    <line x1="230" y1="75" x2="230" y2="455" stroke="#1e3560" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ═══════════ CRITERIO 1: TÉRMICO ═══════════ -->
    <rect x="245" y="80" width="195" height="130" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5" rx="6"/>
    <rect x="245" y="80" width="195" height="26" fill="rgba(37,99,235,0.25)" rx="6"/>
    <text x="342" y="97" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#3b82f6" text-anchor="middle">① Criterio Térmico</text>
    <text x="342" y="123" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Intensidad admisible Iz</text>
    <!-- Fórmula -->
    <rect x="260" y="130" width="165" height="30" fill="rgba(0,0,0,0.3)" rx="4"/>
    <text x="342" y="150" font-family="Arial,sans-serif" font-size="13" fill="#f59e0b" text-anchor="middle" font-style="italic">Ib ≤ Iz · kt · ka</text>
    <text x="258" y="178" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">Ib = corriente de diseño (A)</text>
    <text x="258" y="192" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">kt = factor temperatura</text>
    <text x="258" y="206" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">ka = factor agrupamiento</text>

    <!-- ═══════════ CRITERIO 2: CAÍDA DE TENSIÓN ═══════════ -->
    <rect x="245" y="230" width="195" height="130" fill="rgba(6,182,212,0.08)" stroke="#06b6d4" stroke-width="1.5" rx="6"/>
    <rect x="245" y="230" width="195" height="26" fill="rgba(6,182,212,0.2)" rx="6"/>
    <text x="342" y="247" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#06b6d4" text-anchor="middle">② Caída de Tensión</text>
    <text x="342" y="273" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Límites REBT: 3% (luz) · 5% (fuerza)</text>
    <!-- Fórmula trifásica -->
    <rect x="260" y="280" width="165" height="30" fill="rgba(0,0,0,0.3)" rx="4"/>
    <text x="342" y="299" font-family="Arial,sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle" font-style="italic">S = √3·L·I·cosφ / γ·ΔU</text>
    <text x="258" y="326" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">γCu(70°C) = 48 m/Ω·mm²</text>
    <text x="258" y="340" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">γCu(90°C) = 44 m/Ω·mm²</text>
    <text x="258" y="354" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">γAl(70°C) = 30 m/Ω·mm²</text>

    <!-- ═══════════ CRITERIO 3: CORTOCIRCUITO ═══════════ -->
    <rect x="245" y="380" width="195" height="72" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1.5" rx="6"/>
    <rect x="245" y="380" width="195" height="24" fill="rgba(239,68,68,0.2)" rx="6"/>
    <text x="342" y="396" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">③ Cortocircuito</text>
    <!-- Fórmula adiabática -->
    <rect x="260" y="408" width="165" height="30" fill="rgba(0,0,0,0.3)" rx="4"/>
    <text x="342" y="427" font-family="Arial,sans-serif" font-size="13" fill="#ef4444" text-anchor="middle" font-style="italic">S = Icc · √t / k</text>

    <!-- Línea divisoria 2 -->
    <line x1="455" y1="75" x2="455" y2="455" stroke="#1e3560" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- ═══════════ TABLA SECCIONES COMERCIALES ═══════════ -->
    <text x="670" y="92" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Iz Admisible — Método B2</text>
    <text x="670" y="108" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Cable Cu en tubo empotrado · 40°C</text>

    <!-- Encabezado tabla -->
    <rect x="470" y="115" width="390" height="22" fill="rgba(37,99,235,0.3)" rx="0"/>
    <line x1="470" y1="115" x2="860" y2="115" stroke="#2563eb" stroke-width="1"/>
    <line x1="470" y1="137" x2="860" y2="137" stroke="#2563eb" stroke-width="1"/>
    <text x="527" y="130" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">S (mm²)</text>
    <text x="624" y="130" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">PVC bip (A)</text>
    <text x="720" y="130" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">XLPE bip (A)</text>
    <text x="810" y="130" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3b82f6" text-anchor="middle">PVC trip (A)</text>

    <!-- Datos tabla -->
    <rect x="470" y="137" width="390" height="20" fill="rgba(255,255,255,0.02)"/>
    <text x="527" y="151" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">1,5</text>
    <text x="624" y="151" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">15</text>
    <text x="720" y="151" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">18</text>
    <text x="810" y="151" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">13</text>

    <rect x="470" y="157" width="390" height="20" fill="rgba(255,255,255,0.04)"/>
    <text x="527" y="171" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">2,5</text>
    <text x="624" y="171" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">21</text>
    <text x="720" y="171" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">25</text>
    <text x="810" y="171" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">18</text>

    <rect x="470" y="177" width="390" height="20" fill="rgba(255,255,255,0.02)"/>
    <text x="527" y="191" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">4</text>
    <text x="624" y="191" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">27</text>
    <text x="720" y="191" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">34</text>
    <text x="810" y="191" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">24</text>

    <rect x="470" y="197" width="390" height="20" fill="rgba(255,255,255,0.04)"/>
    <text x="527" y="211" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">6</text>
    <text x="624" y="211" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">34</text>
    <text x="720" y="211" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">43</text>
    <text x="810" y="211" font-family="Arial,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">31 ✓</text>
    <rect x="470" y="197" width="390" height="20" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>

    <rect x="470" y="217" width="390" height="20" fill="rgba(255,255,255,0.02)"/>
    <text x="527" y="231" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">10</text>
    <text x="624" y="231" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">46</text>
    <text x="720" y="231" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">60</text>
    <text x="810" y="231" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">42</text>

    <rect x="470" y="237" width="390" height="20" fill="rgba(255,255,255,0.04)"/>
    <text x="527" y="251" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">16</text>
    <text x="624" y="251" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">61</text>
    <text x="720" y="251" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">80</text>
    <text x="810" y="251" font-family="Arial,sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">56</text>

    <!-- Bordes tabla -->
    <rect x="470" y="115" width="390" height="142" fill="none" stroke="#1e3560" stroke-width="1"/>
    <line x1="580" y1="115" x2="580" y2="257" stroke="#1e3560" stroke-width="0.5"/>
    <line x1="675" y1="115" x2="675" y2="257" stroke="#1e3560" stroke-width="0.5"/>
    <line x1="763" y1="115" x2="763" y2="257" stroke="#1e3560" stroke-width="0.5"/>

    <!-- ═══════════ FLUJO DECISIÓN ═══════════ -->
    <text x="670" y="280" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Procedimiento de selección</text>

    <!-- Paso 1 -->
    <rect x="470" y="290" width="118" height="38" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.5" rx="5"/>
    <text x="529" y="306" font-family="Arial,sans-serif" font-size="9.5" fill="#3b82f6" text-anchor="middle" font-weight="bold">① S por Iz</text>
    <text x="529" y="320" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Criterio térmico</text>
    <!-- Paso 2 -->
    <rect x="611" y="290" width="118" height="38" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5" rx="5"/>
    <text x="670" y="306" font-family="Arial,sans-serif" font-size="9.5" fill="#06b6d4" text-anchor="middle" font-weight="bold">② S por ΔU</text>
    <text x="670" y="320" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Caída tensión</text>
    <!-- Paso 3 -->
    <rect x="742" y="290" width="118" height="38" fill="rgba(239,68,68,0.15)" stroke="#ef4444" stroke-width="1.5" rx="5"/>
    <text x="801" y="306" font-family="Arial,sans-serif" font-size="9.5" fill="#ef4444" text-anchor="middle" font-weight="bold">③ S por Icc</text>
    <text x="801" y="320" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Cortocircuito</text>

    <!-- Flechas hacia max -->
    <line x1="529" y1="328" x2="529" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="670" y1="328" x2="670" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="801" y1="328" x2="801" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="529" y1="352" x2="801" y2="352" stroke="#64748b" stroke-width="1.5"/>
    <line x1="665" y1="352" x2="665" y2="368" stroke="#64748b" stroke-width="1.5"/>

    <!-- Resultado MAX -->
    <rect x="555" y="368" width="222" height="40" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="666" y="384" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">S final = MAX (S1, S2, S3)</text>
    <text x="666" y="400" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">→ Calibre comercial superior</text>

    <!-- Secciones comerciales -->
    <text x="670" y="432" font-family="Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Secciones normalizadas (mm²):</text>
    <text x="670" y="448" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1,5 · 2,5 · 4 · 6 · 10 · 16 · 25 · 35 · 50 · 70 · 95 · 120</text>

    <!-- Normativa -->
    <text x="130" y="428" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Normativa:</text>
    <text x="130" y="442" font-family="Arial,sans-serif" font-size="9.5" fill="#3b82f6" text-anchor="middle">ITC-BT-19 · UNE-HD 60364-5-52</text>
    <text x="130" y="456" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">IEC 60364-4-43</text>
</svg>
